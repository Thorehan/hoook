# Kuyu · skor sunucusu (Cloudflare Worker). Kurulum: docs/online-kurulum.md
name = "kuyu-skor"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Firebase proje kimliği (Project settings → General → Project ID). Herkese açık bir değerdir.
FIREBASE_PROJE = ""
# İstek kabul edilen sayfalar (virgülle)
KOKENLER = "https://thorehan.github.io,http://localhost:8766"

[[d1_databases]]
binding = "DB"
database_name = "kuyu-skor"
# "npx wrangler@4 d1 create kuyu-skor" komutunun verdiği kimlik buraya yazılır
database_id = ""
